# BGP peer: stands in for the France-IX route server (AS 51706).
# Announces 6 prefixes with three different origins:
#   AS 64500 -> RPKI valid      (must pass the import filter)
#   AS 64501 -> RPKI invalid    (must be rejected by ImportFilter)
#   AS 64502 -> no ROA          (NotFound, must pass)
# Phase 2 (peer2.conf = same file without the "# PHASE1" lines):
#   withdraws 2001:db8:100::/48 (accepted) and 203.0.113.0/24 (rejected).
router id 127.0.0.2;
log "peer.log" all;

protocol device { }

protocol static s4 {
  ipv4;
  route 198.51.100.0/24 blackhole;
  route 203.0.113.0/24 blackhole;   # PHASE1
  route 192.0.2.0/24 blackhole;
}

protocol static s6 {
  ipv6;
  route 2001:db8:100::/48 blackhole; # PHASE1
  route 2001:db8:200::/48 blackhole;
  route 2001:db8:300::/48 blackhole;
}

filter Exp {
  if net.type = NET_IP4 then {
    if net ~ [ 198.51.100.0/24 ] then bgp_path.prepend(64500);
    if net ~ [ 203.0.113.0/24 ] then bgp_path.prepend(64501);
    if net ~ [ 192.0.2.0/24 ] then bgp_path.prepend(64502);
  } else {
    if net ~ [ 2001:db8:100::/48 ] then bgp_path.prepend(64500);
    if net ~ [ 2001:db8:200::/48 ] then bgp_path.prepend(64501);
    if net ~ [ 2001:db8:300::/48 ] then bgp_path.prepend(64502);
  }
  accept;
}

protocol bgp dut {
  local 127.0.0.2 as 51706;
  neighbor 127.0.0.3 as 215011;
  multihop;
  strict bind on;
  ipv4 { import none; export filter Exp; };
  ipv6 { import none; export filter Exp; extended next hop on; };
}
